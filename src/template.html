<style>
/* Layout: header berisi aksi utama, tab langkah 1-4 untuk input, tab hasil (Plan, Gantt, Peta). Nuansa rambu jalan + papan logistik. */
:root {
  --bg: #f3f5f4; --surface: #ffffff; --surface2: #eaeeec; --line: #d5dcd9; --fg: #17201d; --muted: #5b6a65;
  --accent: #0b6e5f; --accent-fg: #ffffff; --accent-soft: #d9efe9; --sign: #f2b705;
  --warn: #b45309; --warn-bg: #fdf1dc; --bad: #b42318; --bad-bg: #fde7e4; --ok: #157f3c;
  --seg-act: #7b8a85; --seg-drive: #3b74d9; --seg-drop: #1f9d55; --seg-pick: #8e44c8; --seg-wait: #e3a008; --brk: rgba(23,32,29,.09);
  --d0: #2563eb; --d1: #e11d48; --d2: #16a34a; --d3: #9333ea; --d4: #ea8c00; --d5: #0891b2; --d6: #64748b;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif; --f-body: "IBM Plex Sans", system-ui, sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111816; --surface: #18211e; --surface2: #202b27; --line: #2f3c37; --fg: #e6ece9; --muted: #95a49f;
  --accent: #3cc3a8; --accent-fg: #06201a; --accent-soft: #173a33; --sign: #f2b705;
  --warn: #f0b35a; --warn-bg: #3a2a12; --bad: #ff8a7a; --bad-bg: #3d1b17; --ok: #5bd28a;
  --seg-act: #8a9a95; --seg-drive: #5b8ff0; --seg-drop: #35b86c; --seg-pick: #b27ae0; --seg-wait: #f0b429; --brk: rgba(230,236,233,.08);
  --d0: #5b8ff0; --d1: #fb6f8f; --d2: #3fcf73; --d3: #b27ae0; --d4: #f5a524; --d5: #2fc0dc; --d6: #94a3b8; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111816; --surface: #18211e; --surface2: #202b27; --line: #2f3c37; --fg: #e6ece9; --muted: #95a49f;
  --accent: #3cc3a8; --accent-fg: #06201a; --accent-soft: #173a33; --sign: #f2b705;
  --warn: #f0b35a; --warn-bg: #3a2a12; --bad: #ff8a7a; --bad-bg: #3d1b17; --ok: #5bd28a;
  --seg-act: #8a9a95; --seg-drive: #5b8ff0; --seg-drop: #35b86c; --seg-pick: #b27ae0; --seg-wait: #f0b429; --brk: rgba(230,236,233,.08);
  --d0: #5b8ff0; --d1: #fb6f8f; --d2: #3fcf73; --d3: #b27ae0; --d4: #f5a524; --d5: #2fc0dc; --d6: #94a3b8; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 1000; background: var(--surface); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 1001; background: var(--surface); }
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand .mark { width: 30px; height: 30px; background: var(--sign); color: #17201d; transform: rotate(45deg); border-radius: 4px; display: grid; place-items: center; flex: none; }
.brand .mark span { transform: rotate(-45deg); font: 700 15px/1 var(--f-display); }
.brand h1 { font: 700 22px/1 var(--f-display); letter-spacing: .02em; margin: 0; text-transform: uppercase; text-wrap: balance; }
.brand small { display: block; font: 400 12px/1.2 var(--f-body); color: var(--muted); letter-spacing: 0; text-transform: none; margin-top: 2px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; border: 0; background: none; color: var(--muted); font: 600 15px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; padding: 12px 14px 11px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.tab .n { display: inline-grid; place-items: center; width: 19px; height: 19px; border-radius: 50%; background: var(--surface2); color: var(--fg); font-size: 12px; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab[aria-selected="true"] .n { background: var(--accent); color: var(--accent-fg); }
.tab.sep { margin-left: 14px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 500 13px/1 var(--f-body); padding: 9px 12px; border-radius: var(--r); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: 6px 9px; font-size: 12px; }
.btn.icon { padding: 6px 8px; color: var(--muted); }
.btn.icon:hover { color: var(--bad); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { padding-block: 20px 60px; }
.panel { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.panel > *, .grid2 > *, .grid3 > *, .head > div { min-width: 0; }
.head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.head h2 { font: 700 28px/1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; margin: 0; margin-right: auto; text-wrap: balance; }
.head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.card.pad { padding: 16px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font: 600 12px/1.2 var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
.in { width: 100%; min-width: 0; border: 1px solid transparent; background: var(--surface2); color: var(--fg); border-radius: 4px; padding: 6px 7px; font: 400 13px/1.2 var(--f-body); }
.in:hover { border-color: var(--line); }
.in:focus { border-color: var(--accent); background: var(--surface); outline: none; }
.in.num { text-align: right; font-family: var(--f-mono); font-size: 12.5px; }
.in.mono { font-family: var(--f-mono); font-size: 12px; }
select.in { padding-right: 4px; }
input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
.sub { display: block; color: var(--muted); font: 400 11px/1.2 var(--f-mono); margin-top: 3px; text-align: right; }
.hint { color: var(--muted); font-size: 12px; }
.msg { font-size: 11px; margin-top: 3px; }
.msg.bad { color: var(--bad); } .msg.ok { color: var(--ok); }
.days { display: flex; gap: 3px; }
.dchip { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: 600 11px/1 var(--f-mono); padding: 5px 0; width: 34px; border-radius: 4px; cursor: pointer; }
.dchip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.dchip.big { width: auto; padding: 8px 12px; font: 600 13px/1 var(--f-body); }
.dchip:disabled { opacity: .45; cursor: not-allowed; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 12px; }
.field { display: grid; gap: 5px; }
.field label { font: 600 12px/1.2 var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.field .row { display: flex; gap: 8px; align-items: center; }
.field .in { font-size: 14px; padding: 8px 9px; }
.daycard h3, .card h3 { font: 700 18px/1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; margin: 0; }
.daycard { padding: 14px; display: grid; gap: 10px; align-content: start; }
.daycard .hrow { display: flex; align-items: center; gap: 8px; }
.daycard .hrow h3 { margin-right: auto; }
.brow { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 6px; align-items: center; }
.off { color: var(--muted); font-size: 12px; font-style: italic; }
.banner { border-radius: var(--r); padding: 10px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.banner.info { background: var(--accent-soft); color: var(--fg); }
.banner b { font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.tile .k { font: 600 11px/1.2 var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.tile .v { font: 700 30px/1.1 var(--f-display); margin-top: 6px; font-variant-numeric: tabular-nums; }
.tile .v small { font: 500 14px var(--f-body); color: var(--muted); margin-left: 3px; }
.tile.alert .v { color: var(--bad); }
.dayblock { display: grid; gap: 10px; }
.dayhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dayhead h3 { font: 700 22px/1 var(--f-display); text-transform: uppercase; margin: 0; letter-spacing: .03em; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 500 12px/1 var(--f-body); padding: 4px 8px; border-radius: 99px; background: var(--surface2); color: var(--muted); white-space: nowrap; }
.pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.ok { background: var(--accent-soft); color: var(--accent); }
.trip { overflow: hidden; }
.trip-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 14px; background: var(--surface2); border-bottom: 1px solid var(--line); }
.trip-h .veh { font: 700 17px/1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.plate { font: 600 12px/1 var(--f-mono); border: 1.5px solid var(--fg); border-radius: 3px; padding: 3px 6px; background: var(--surface); }
.trip-h .meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.trip-h .meta b { color: var(--fg); font-weight: 600; }
.trip-h a { margin-left: auto; color: var(--accent); font-weight: 600; font-size: 12.5px; text-decoration: none; }
.trip-h a:hover { text-decoration: underline; }
.meter { width: 70px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 4px; }
.meter i { display: block; height: 100%; background: var(--accent); }
.mono { font-family: var(--f-mono); font-size: 12.5px; }
.tag { font: 600 10.5px/1 var(--f-body); text-transform: uppercase; letter-spacing: .05em; padding: 3px 6px; border-radius: 3px; white-space: nowrap; }
.tag.drop { background: color-mix(in srgb, var(--seg-drop) 18%, transparent); color: var(--seg-drop); }
.tag.pick { background: color-mix(in srgb, var(--seg-pick) 18%, transparent); color: var(--seg-pick); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
.gantt-wrap { overflow-x: auto; position: relative; }
#gantt svg text { font-family: var(--f-body); }
.tip { position: fixed; z-index: 2000; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 12px; padding: 7px 9px; border-radius: 5px; max-width: 280px; line-height: 1.4; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
.tip b { font-weight: 600; }
#map { height: min(72vh, 680px); min-height: 380px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface2); }
.map-gray .leaflet-tile-pane { filter: grayscale(1) contrast(.95) brightness(1.04); }
:root[data-theme="dark"] .map-gray .leaflet-tile-pane { filter: grayscale(1) invert(.9) contrast(.85); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .map-gray .leaflet-tile-pane { filter: grayscale(1) invert(.9) contrast(.85); } }
.leaflet-container { font-family: var(--f-body); }
.leaflet-popup-content { font-size: 12.5px; }
.storepin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
.depotpin { width: 22px; height: 22px; background: #17201d; color: #f2b705; border: 2px solid #f2b705; transform: rotate(45deg); border-radius: 3px; display: grid; place-items: center; }
.depotpin span { transform: rotate(-45deg); font: 700 11px/1 var(--f-display); }
.seqpin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; color: #fff; font: 700 10px/14px var(--f-mono); text-align: center; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
.maptools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.maplist { display: grid; gap: 6px; }
.maplist label { display: flex; gap: 8px; align-items: center; font-size: 12.5px; cursor: pointer; }
.empty { padding: 30px; text-align: center; color: var(--muted); }
.menu { position: relative; }
.menu-pop { position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 6px; display: grid; min-width: 230px; z-index: 1100; }
.menu-pop button { appearance: none; background: none; border: 0; text-align: left; padding: 9px 10px; border-radius: 4px; font: 400 13px var(--f-body); color: var(--fg); cursor: pointer; }
.menu-pop button:hover { background: var(--surface2); }
.menu-pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 6px; z-index: 3000; font-size: 13px; max-width: calc(100vw - 32px); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
details.adv summary { cursor: pointer; font: 600 15px var(--f-display); text-transform: uppercase; letter-spacing: .04em; padding: 2px 0; }
details.adv[open] summary { margin-bottom: 12px; }
@media (max-width: 640px) { .head h2 { font-size: 24px; } .brand small { display: none; } .tab.sep { margin-left: 6px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><div class="mark"><span>PD</span></div><div><h1>Perencana Distribusi</h1><small id="brandSub">Plan mingguan, Gantt armada, dan peta rute</small></div></div>
      <button class="btn primary" id="btnPlan" type="button">▶ Buat Plan</button>
      <div class="menu">
        <button class="btn" id="btnMenu" type="button" aria-haspopup="true">Data ▾</button>
        <div class="menu-pop" id="menuPop" hidden>
          <button type="button" data-act="excel">Unduh plan (Excel)</button>
          <button type="button" data-act="export">Simpan data input (JSON)</button>
          <button type="button" data-act="import">Buka data input (JSON)</button>
          <button type="button" data-act="importStore">Impor store dari Excel/CSV</button>
          <button type="button" data-act="template">Unduh template store (Excel)</button>
          <hr>
          <button type="button" data-act="html">Unduh aplikasi ini (HTML)</button>
          <hr>
          <button type="button" data-act="sample">Muat contoh data Lazuna</button>
          <button type="button" data-act="clear">Kosongkan semua data</button>
        </div>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="kendaraan"><span class="n">1</span>Kendaraan</button>
      <button class="tab" role="tab" data-tab="store"><span class="n">2</span>Store</button>
      <button class="tab" role="tab" data-tab="istirahat"><span class="n">3</span>Istirahat</button>
      <button class="tab" role="tab" data-tab="parameter"><span class="n">4</span>Parameter</button>
      <button class="tab sep" role="tab" data-tab="plan">Plan</button>
      <button class="tab" role="tab" data-tab="gantt">Gantt</button>
      <button class="tab" role="tab" data-tab="peta">Peta Rute</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="confirmBox" hidden></div>
  <section class="panel" id="p-kendaraan" hidden></section>
  <section class="panel" id="p-store" hidden></section>
  <section class="panel" id="p-istirahat" hidden></section>
  <section class="panel" id="p-parameter" hidden></section>
  <section class="panel" id="p-plan" hidden></section>
  <section class="panel" id="p-gantt" hidden></section>
  <section class="panel" id="p-peta" hidden>
    <div class="head"><div><h2>Peta Rute</h2><p>Peta dasar abu-abu, hanya rute dan titik store yang berwarna. Pilih semua hari (warna per hari) atau satu hari (warna per rit).</p></div></div>
    <div class="maptools" id="mapTools"></div>
    <div id="mapNote"></div>
    <div id="map"></div>
    <div class="legend" id="mapLegend"></div>
  </section>
</main>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileStore" accept=".xlsx,.xls,.csv" hidden>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>
